spring:
  application:
    name: mediflow-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mediflow}
    username: ${DB_USERNAME:mediflow}
    password: ${DB_PASSWORD:mediflow}
    hikari:
      data-source-properties:
        # Keep row values (patient ids, emails, times) out of SQL exception messages and logs.
        logServerErrorDetail: false
  jpa:
    # Flyway owns the schema; Hibernate only checks that entities match it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
